name: build

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag is on main branch
        run: |
          # Get the commit SHA that the tag points to
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})
          echo "Tag commit: $TAG_COMMIT"
          
          # Check if this commit is on the main branch
          if ! git branch -r --contains $TAG_COMMIT | grep -q 'origin/main'; then
            echo "Error: Tag ${{ github.ref_name }} is not on the main branch"
            echo "Releases can only be created from the main branch"
            exit 1
          fi
          
          echo "Tag is on main branch, proceeding with release"
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: 🔗 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel
      - name: 💎 Install
        run: |
          python -m pip install --no-cache-dir -r requirements-dev.txt
      - name: 💃 Build release
        run: |
          python setup.py clean --all sdist bdist_wheel
      - name: 📦 Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
            password: ${{ secrets.pypi_password }}
      - name: 📝 Extract release notes from changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ["VERSION"].lstrip("v")
          lines = open("CHANGELOG.rst", encoding="utf-8").read().splitlines()

          # Collect the lines of the "<version>" section (heading underlined with dashes)
          section, inside = [], False
          for i, line in enumerate(lines):
              is_heading = i + 1 < len(lines) and re.fullmatch(r"-{3,}", lines[i + 1])
              if is_heading:
                  if inside:
                      break
                  inside = line.strip() == version
                  continue
              if inside and not re.fullmatch(r"-{3,}", line):
                  section.append(line)
          if not section:
              raise SystemExit(f"No section for {version} in CHANGELOG.rst")

          # Convert to Markdown: **Group** -> ## Group (skipping empty groups),
          # join wrapped bullet lines, ``code`` -> `code`
          groups, current = [], None
          for line in section:
              m = re.fullmatch(r"\*\*(.+)\*\*", line.strip())
              if m:
                  current = (m.group(1), [])
                  groups.append(current)
              elif current and line.startswith("* "):
                  current[1].append(line)
              elif current and current[1] and line.startswith("  ") and line.strip():
                  current[1][-1] += " " + line.strip()

          out = []
          for title, items in groups:
              if items:
                  out += [f"## {title}", ""] + [i.replace("``", "`") for i in items] + [""]
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(out))
          print("\n".join(out))
          PY
      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --verify-tag \
            --title "roslibpy ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --generate-notes
